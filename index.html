<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nexus Objects — interactive 3D studio space.">
  <title>NEXUS / Objects</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root{--black:#f8e6ed;--white:#55243f;--acid:#c76891;--red:#a94470;--line:rgba(85,36,63,.22)}
    html,body{background:#f8e6ed;color:#55243f}
    .webgl{opacity:1}
    .ui-container{opacity:1;visibility:visible}
    .ui-container.intro-ready{visibility:visible}
    .ui-container.intro-ready .logo,.ui-container.intro-ready .header-meta,.ui-container.intro-ready .side-label,.ui-container.intro-ready .hero-copy,.ui-container.intro-ready .progress{visibility:hidden}
    .hero-copy,.side-label,.progress{display:none!important}.logo,.header-meta{display:flex!important}.webgl-fallback-title{position:fixed;left:50%;top:50%;z-index:4;transform:translate(-50%,-50%);color:#55243f;font:700 clamp(38px,7vw,110px) Manrope,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;pointer-events:none}
    .pointer-dot{position:fixed;left:0;top:0;width:10px;height:10px;border-radius:50%;background:#8d3d67;border:1px solid rgba(255,247,251,.72);box-shadow:0 0 0 3px rgba(141,61,103,.16),0 2px 12px rgba(0,0,0,.08);pointer-events:none;transform:translate(-50%,-50%);z-index:9999;opacity:0;transition:opacity .25s ease}
    .pointer-dot.visible{opacity:1}
    .section-two{pointer-events:auto}.start-btn{min-width:132px;padding:16px 30px;border:1px solid #55243f;border-radius:999px;background:#55243f;color:#fff0f5;font:500 11px "DM Mono",monospace;letter-spacing:.18em;text-transform:uppercase}
      .tunnel-container{position:fixed;top:0;left:0;width:100vw;height:5100vh;z-index:999;display:none;overflow:hidden;will-change:transform;background:#111!important;transform:translate3d(0,0,0)}
      .tunnel-floor,.final-screen{width:100vw;height:100vh;margin:0;padding:0;display:block;position:relative;flex:none;overflow:hidden}
      .floor-inner{position:absolute;inset:0;opacity:.32;color:#ddd}.floor-title{position:absolute;z-index:2;margin:0;color:#eee;font:600 clamp(42px,9vw,150px) Manrope,Arial,sans-serif;letter-spacing:-.04em;text-transform:uppercase;line-height:.9}
      .template-1{background:#221a1a}.template-1 .floor-title{top:13%;left:50%;transform:translateX(-50%);font-size:clamp(32px,5vw,82px);letter-spacing:.02em}.template-1 .card-round{width:min(42vw,430px);height:min(42vw,430px);border-radius:50%;background:radial-gradient(circle at 30% 30%,#f8d9e2,#8d3d67 72%,#28161f 100%);position:absolute;left:50%;top:50%;transform:translate(-50%,-46%)}
      .template-2{background:#141414}.template-2 .floor-title{inset:50% auto auto 50%;transform:translate(-50%,-50%);font-size:clamp(80px,19vw,300px);white-space:nowrap}.template-2 .side-card{top:14%;right:8%;width:22%;height:28%;border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,#777,#111);position:absolute}
      .template-3{background:#1d1d1d}.template-3 .floor-inner{display:grid;grid-template-columns:repeat(3,1fr);gap:3vw;align-content:center;padding:10vw}.template-3 .floor-card{position:relative;height:62vh;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06)}
      .template-4{background:#141414}.template-4 .auto-card{left:7%;right:7%;top:38%;height:24%;border-radius:50% 46% 22% 20%;background:linear-gradient(180deg,#666 0%,#242424 55%,#111 100%);opacity:.9;position:absolute}
      .template-5{background:#221a1a}.template-5 .arch-a{left:8%;top:17%;width:42%;height:48%}.template-5 .arch-b{right:9%;bottom:13%;width:33%;height:38%}.template-5 .floor-title{right:8%;top:10%;font-size:clamp(34px,7vw,96px)}
      .template-6{background:#1d1d1d}.template-6:before,.template-6:after{content:'';position:absolute;left:25%;right:25%;height:1px;background:rgba(255,255,255,.3)}.template-6:before{top:16%}.template-6:after{bottom:18%}
      .template-7{background:linear-gradient(135deg,#221a1a,#141414 58%,#3b292c)}.template-7 .resort-card{left:8%;right:8%;bottom:9%;height:26%;background:linear-gradient(90deg,#403237,#8d7277 50%,#302227);position:absolute}
      .template-8{background:#141414}.template-8:before,.template-8:after{content:'';position:absolute;background:rgba(210,210,210,.25)}.template-8:before{left:16%;right:16%;top:50%;height:1px}.template-8:after{top:16%;bottom:16%;left:50%;width:1px}
      .template-9{background:radial-gradient(circle at 50% 45%,#4b3038,#221a1a 48%,#141414)}.template-9 .beauty-card{left:50%;top:50%;width:17%;height:60%;transform:translate(-50%,-50%);border-radius:50% 50% 24% 24%;background:linear-gradient(180deg,#f0d9df,#b77b8b 46%,#2a1a1f);position:absolute}
      .template-10{background:#1d1d1d}.template-10 .shape{position:absolute;border:1px solid rgba(255,255,255,.25);background:#c5b5b8;opacity:.25}.template-10 .shape:nth-child(1){width:18vw;height:18vw;left:12%;top:18%}.template-10 .shape:nth-child(2){width:26vw;height:9vw;right:10%;bottom:16%}
      .tunnel-floor:nth-child(odd){background:linear-gradient(to bottom,#0d0d0d 0%,#1a1a1a 100%)}.tunnel-floor:nth-child(even){background:linear-gradient(to bottom,#3a3a3a 0%,#0d0d0d 100%)}
      .tunnel-floor:after{content:'';position:absolute;inset:0;box-shadow:inset 0 -24px 44px rgba(0,0,0,.2),inset 0 24px 44px rgba(0,0,0,.14);pointer-events:none}
      .final-screen{background:#111;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center}
      .final-line{display:block;position:relative;z-index:2;width:max-content;max-width:90vw;overflow:hidden;margin:0;opacity:1;font:600 clamp(26px,5vw,72px) Manrope,Arial,sans-serif;letter-spacing:-.03em;text-transform:uppercase}
      .back-btn{position:relative;z-index:2;isolation:isolate;overflow:hidden;margin-top:68px;padding:12px 24px;border:1px solid rgba(255,255,255,.4);border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font:500 11px "DM Mono",monospace;letter-spacing:.18em;text-transform:uppercase}
      .tunnel-active{overflow:hidden}
    @media (pointer:coarse){body{cursor:auto}.pointer-dot{display:none}}
    .floor-inner{opacity:1;color:#f4eef0}.fake-site-screen{position:absolute;inset:5vh 5vw;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);overflow:hidden}.fake-header{height:72px;border-bottom:1px solid rgba(255,255,255,.12)}
    .fake-site-screen{position:absolute!important;inset:0!important;width:100vw!important;height:100vh!important;border:0!important;background:#111!important;overflow:hidden!important}.fake-site-screen *{box-sizing:border-box}
    .browser-mockup{position:absolute!important;inset:4vh 4vw!important;width:auto!important;height:auto!important;border:1px solid rgba(255,255,255,.14)!important;background:rgba(255,255,255,.04)!important}
    .browser-mockup{position:relative!important;background-color:transparent!important;background-size:cover;background-position:center;background-repeat:no-repeat}.browser-mockup::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0));pointer-events:none}
    .fake-site-screen{width:100vw!important;height:100vh!important;max-width:100vw!important;max-height:100vh!important;margin:0!important;padding:0!important;box-sizing:border-box;position:relative!important}
    .section-three .contact-copy a{color:#a43c6e;border-color:#a43c6e}
    .ui-container .logo,.ui-container .header-meta{visibility:visible}.ui-container .side-label,.ui-container .hero-copy,.ui-container .progress{visibility:hidden}
    .header-meta,.side-label,.progress{color:rgba(23,23,23,.62)}
    .menu-toggle i{background:#fff}
    .hero-copy,.side-label,.progress{transition:opacity .55s ease,transform .55s ease}
    body.scrolled-past-hero .hero-copy{opacity:0;transform:translateY(-25px);pointer-events:none}
    body.scrolled-past-hero .side-label,body.scrolled-past-hero .progress{opacity:0;pointer-events:none}
  </style>
  <style>.final-line.instagram-line{cursor:pointer;text-decoration:none}.final-line.instagram-line:hover{color:#fff}.final-line.instagram-line:hover .line-content{border-bottom-color:#fff}</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js"}}</script>
</head>
<body>
  <canvas class="webgl"></canvas>
  <div class="webgl-fallback-title">NEXUS</div>
  <div class="ui-container">
    <header class="site-header">
      <a class="logo" href="#top" aria-label="NEXUS, наверх">NEXUS</a>
      <div class="header-meta"><span>Websites for sale</span><a href="https://www.instagram.com/lost.spriteee/" target="_blank" rel="noopener noreferrer">Instagram: @lost.spriteee</a></div>
      <button class="menu-toggle" type="button" aria-label="Открыть меню" aria-expanded="false"><i></i><i></i></button>
    </header>
    <div class="side-label"><span>Interactive study</span><span class="side-line"></span><span>Scroll to move</span></div>
    <div class="hero-copy">
      <p class="kicker">A collection of things<br>that do not sit still.</p>
      <h1>Objects<br><em>in orbit.</em></h1>
      <a class="explore-link" href="#space"><span>Enter the space</span><b>↘</b></a>
    </div>
    <div class="progress"><span class="progress-fill"></span><span>01</span><span>/ 03</span></div>
  </div>
  <div class="menu-panel" aria-hidden="true">
    <button class="menu-close" type="button" aria-label="Закрыть меню">×</button>
    <nav><a href="#top">NEXUS <sup>01</sup></a><a href="#space">Websites for sale <sup>02</sup></a><a href="https://www.instagram.com/lost.spriteee/" target="_blank" rel="noopener noreferrer">Instagram <sup>03</sup></a></nav>
    <p>NEXUS<br>Websites for sale</p>
  </div>
  <main data-scroll-container id="top">
    <section class="scroll-section section-one" aria-label="Введение"><span id="space"></span></section>
    <section class="scroll-section section-two" aria-label="Объекты"><div class="section-number">02</div></section>
      <div class="tunnel-container" aria-hidden="true"></div>
    <section class="scroll-section section-three" id="contact" aria-label="Контакты"><button class="start-btn" type="button">START</button><span class="start-caption">@lost.spriteee</span><div class="contact-copy"></div></section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
